name = "chuckeke"
compatibility_date = "2026-05-22"

[build]
command = "rm -rf public && mkdir -p public/_astro && cp -r pages/. public/ && cp -r assets/. public/ && cp assets/css/about.Cl92HC4C.css public/_astro/about.Cl92HC4C.css"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
